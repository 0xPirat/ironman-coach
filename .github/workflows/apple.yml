name: Apple builds

on:
  push:
    branches: [main]
    tags: ["apple-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apple:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: frontend
        run: xcodegen generate --spec project.yml

      - name: Build macOS app without a developer certificate
        working-directory: frontend
        run: |
          xcodebuild \
            -project IronmanCoach.xcodeproj \
            -scheme Coach-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/coach-macos" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          codesign --force --deep --sign - "$RUNNER_TEMP/coach-macos/Build/Products/Release/Coach.app"

      - name: Build iPhone/iPad simulator app
        working-directory: frontend
        run: |
          xcodebuild \
            -project IronmanCoach.xcodeproj \
            -scheme Coach-iOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/coach-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned artifacts
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/coach-macos/Build/Products/Release/Coach.app" \
            dist/Coach-macOS-adhoc-not-notarized.zip
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/coach-ios/Build/Products/Release-iphonesimulator/Coach.app" \
            dist/Coach-iOS-Simulator-only.zip
          shasum -a 256 dist/*.zip > dist/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Coach-Apple-unsigned
          path: dist/*
          if-no-files-found: error

      - name: Attach artifacts to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/apple-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --generate-notes \
            --title "Coach $GITHUB_REF_NAME" \
            --notes "Apple-Artefakte ohne Apple-Developer-Zertifikat. Die iOS-Datei funktioniert nur im Simulator; Installation auf iPhone/iPad erfolgt aus Xcode mit eigener Signierung. Die macOS-App ist ad-hoc-signiert, aber nicht notarisiert. Siehe APPLE_DISTRIBUTION.md."
